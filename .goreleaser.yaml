version: 2

project_name: mr-ducksafe

before:
  hooks:
    - go mod tidy

builds:
  - id: mr-ducksafe
    main: ./cmd/mr-ducksafe
    binary: mr-ducksafe
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/yemresalcan/mr-ducksafe/internal/cmd.Version={{.Version}}
    goos:
      - windows
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - id: default
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md
      - README.tr.md

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

sboms:
  - id: archive-sbom
    artifacts: archive
    documents:
      - "{{ .ArtifactName }}.sbom.json"

changelog:
  sort: asc
  use: github
  groups:
    - title: Features
      regexp: "^.*feat(\\(.+\\))?:.*$"
      order: 0
    - title: Bug Fixes
      regexp: "^.*fix(\\(.+\\))?:.*$"
      order: 1
    - title: Build & Release
      regexp: "^.*(build|ci|chore)(\\(.+\\))?:.*$"
      order: 2
    - title: Documentation
      regexp: "^.*docs(\\(.+\\))?:.*$"
      order: 3
    - title: Other
      order: 999
  filters:
    exclude:
      - "^test:"
      - "^style:"
      - "Merge pull request"

release:
  github:
    owner: yemresalcan
    name: mr-ducksafe
  draft: false
  prerelease: auto
  # If the release was already created in the GitHub UI, overwrite its notes
  # with the header + changelog below instead of keeping an empty body.
  mode: replace
  header: |
    ## mr-ducksafe {{ .Tag }}

    NVD CVE scanner for the software installed on Windows — a single binary, straight from the terminal.
    525 CVEs → 14 action items: plain-language risk, a fix command for every finding.

    **Quick start (Windows):** download `mr-ducksafe_{{ .Version }}_Windows_x86_64.zip` below, unzip, then run:

    ```powershell
    .\mr-ducksafe.exe scan
    ```

    Or with Go 1.25+: `go install github.com/yemresalcan/mr-ducksafe/cmd/mr-ducksafe@{{ .Tag }}`

    > The scanner currently reads the Windows Registry only. Linux/macOS binaries are published for
    > CI/tooling use, but `scan` reports "unsupported OS" there until v0.2.
  footer: |
    ---
    SHA256 checksums are in `checksums.txt`. An SBOM (CycloneDX, `*.sbom.json`) is published for every archive.
    Free NVD API key for ~10x faster scans: https://nvd.nist.gov/developers/request-an-api-key
